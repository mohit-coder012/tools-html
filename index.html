/* ─── API CONFIG ─── */
const API_BASE = "https://tools.visibilitystack.com/api/v1";

const api = {
  createJob: async (topics, email, frequency = 1) => {
    const r = await fetch(`${API_BASE}/content_spark/`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topics, email, frequency: Math.min(2, Math.max(1, Number(frequency) || 1)) }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => null);
      const msg = err?.detail?.message || err?.detail || "Failed to create job.";
      throw new Error(msg);
    }
    const d = await r.json();
    return d.data.data.job_id;
  },
  getAngles: async (jobId) => {
    const r = await fetch(`${API_BASE}/content_spark/result/${jobId}`, { headers: { accept: "application/json" } });
    if (!r.ok) throw new Error("Failed to get angles");
    return (await r.json()).data;
  },
  processAngles: async (jobId, angleIds, tone) => {
    const r = await fetch(`${API_BASE}/content_spark/process_angles`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ job_id: jobId, angle_ids: angleIds, tone }),
    });
    if (!r.ok) throw new Error("Failed to start post generation");
    return await r.json();
  },
};

/* ─── DATA MAPPERS ─── */
const mapXPost = (p) => ({ id: p.id, text: p.content, hashtags: "", orderIndex: p.order_index });

const mapLinkedinPost = (p) => {
  const content = p.content || "";
  const paras = content.split("\n\n").filter(s => s.trim());
  const hook = paras[0] || "";
  const cta = paras.length > 1 ? paras[paras.length - 1] : "";
  const body = paras.length > 2 ? paras.slice(1, -1).join("\n\n") : "";

const MAX_TOPICS = 2;
const MAX_FREQUENCY = 2;

const LandingScreen = ({ topics, setTopics, email, setEmail, frequency, setFrequency, onSubmit, loading, error }) => {
  const [focused, setFocused] = useState(null);
  const [topicInput, setTopicInput] = useState("");

  const addTopicsFromText = (rawText) => {
    if (!rawText || topics.length >= MAX_TOPICS) return false;
    const parts = rawText
      .split(",")
      .map((t) => t.trim())
      .filter(Boolean);
    if (parts.length === 0) return false;

    const next = [...topics];
    parts.forEach((part) => {
      if (next.length < MAX_TOPICS && !next.includes(part)) {
        next.push(part);
      }
    });

    if (next.length !== topics.length) {
      setTopics(next);
      return true;
    }
    return false;
  };

  const removeTopic = (idx) => setTopics(topics.filter((_, i) => i !== idx));

  const handleSubmit = () => {
    let finalTopics = topics;
    const pending = topicInput.trim();
    if (pending && topics.length < MAX_TOPICS) {
      const pendingParts = pending
        .split(",")
        .map((t) => t.trim())
        .filter(Boolean);
      if (pendingParts.length > 0) {
        const merged = [...topics];
        pendingParts.forEach((part) => {
          if (merged.length < MAX_TOPICS && !merged.includes(part)) {
            merged.push(part);
          }
        });
        finalTopics = merged;
        if (merged.length !== topics.length) {
          setTopics(merged);
        }
      }
    }
    if (finalTopics.length === 0 || !email.trim()) return;
    const freq = Math.min(MAX_FREQUENCY, Math.max(1, Number(frequency) || 1));
    onSubmit(finalTopics, email.trim(), freq);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "56px 20px 64px", minHeight: "85vh", position: "relative" }}>
      <div style={{ position: "absolute", top: -120, left: "50%", transform: "translateX(-50%)", width: 800, height: 400, background: "radial-gradient(ellipse, rgba(0,146,148,0.06) 0%, rgba(0,109,111,0.03) 40%, transparent 70%)", pointerEvents: "none" }} />

      <h1 style={{ fontSize: "clamp(34px, 5vw, 52px)", fontWeight: 800, lineHeight: 1.1, margin: "0 0 22px", fontFamily: "'Manrope', sans-serif", color: C.text, maxWidth: 680, textAlign: "center", position: "relative" }}>
        Stop guessing{" "}
        <span style={{ background: "linear-gradient(135deg, " + C.primary + " 0%, " + C.primaryLight + " 100%)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>what to create</span>
        {" "}this week
      </h1>

      <p style={{ fontSize: 18, color: C.textMuted, maxWidth: 520, margin: "0 0 44px", lineHeight: 1.65, textAlign: "center", position: "relative" }}>
        ChatGPT gives you generic topic ideas. We scan what's actually performing across social, search & communities, surface top angles worth posting about, and write the posts for the one you pick. Weekly content calendar, done.
      </p>

      <div style={{ width: "100%", maxWidth: 480, position: "relative" }}>

        {/* Topic tag input */}
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12, color: C.textMuted, marginBottom: 7, fontWeight: 600 }}>
            <span>Topics <span style={{ fontWeight: 400, opacity: 0.6 }}>(up to {MAX_TOPICS})</span></span>
            <span style={{ fontSize: 11, color: topics.length >= MAX_TOPICS ? C.red : C.textMuted }}>{topics.length}/{MAX_TOPICS}</span>
          </label>

          {/* Tags */}
          {topics.length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
              {topics.map((t, i) => (
                <div key={i} style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 10px", background: C.primaryDim, border: "1px solid rgba(0,146,148,0.3)", borderRadius: 20, fontSize: 12, color: C.primary, fontWeight: 600 }}>
                  {t}
                  <span onClick={() => removeTopic(i)} style={{ cursor: "pointer", fontSize: 14, lineHeight: 1, color: C.primary, opacity: 0.7, marginLeft: 2 }}>×</span>
                </div>
              ))}
            </div>
          )}

          {/* Input */}
          {topics.length < MAX_TOPICS && (
            <div style={{ display: "flex" }}>
              <input
                value={topicInput}
                onChange={e => setTopicInput(e.target.value)}
                placeholder={topics.length === 0 ? "e.g. loan management software" : "Add another topic..."}
                style={{ flex: 1, padding: "12px 14px", background: C.surface, border: "1px solid " + (focused === "topic" ? C.primary : C.border), borderRadius: 10, color: C.text, fontSize: 14, outline: "none", boxSizing: "border-box", transition: "border-color 0.25s, box-shadow 0.25s", boxShadow: focused === "topic" ? "0 0 0 3px " + C.primaryDim : "none", fontFamily: "'Manrope', sans-serif" }}
                onFocus={() => setFocused("topic")} onBlur={() => setFocused(null)}
                onKeyDown={e => {
                  if (e.key === "Enter" || e.key === ",") {
                    e.preventDefault();
                    const added = addTopicsFromText(topicInput);
                    if (added) setTopicInput("");
                  }
                }}
              />
            </div>
          )}
        </div>

        <div style={{ marginBottom: 20 }}>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: C.textMuted, marginBottom: 7, fontWeight: 600 }}>Work Email</label>
          <input
            value={email}
            onChange={e => setEmail(e.target.value)}
            placeholder="you@company.com"
            style={{ width: "100%", padding: "14px 16px", background: C.surface, border: "1px solid " + (focused === "email" ? C.primary : C.border), borderRadius: 12, color: C.text, fontSize: 14, outline: "none", boxSizing: "border-box", transition: "border-color 0.25s, box-shadow 0.25s", boxShadow: focused === "email" ? "0 0 0 3px " + C.primaryDim : "none", fontFamily: "'Manrope', sans-serif" }}
            onFocus={() => setFocused("email")} onBlur={() => setFocused(null)}
            onKeyDown={e => e.key === "Enter" && handleSubmit()}
          />
        </div>

        {error && (
          <div style={{ marginBottom: 14, padding: "10px 14px", background: C.redDim, border: "1px solid " + C.red, borderRadius: 8, fontSize: 12, color: C.red, fontWeight: 600 }}>
            {error}
          </div>
        )}

        <button
          onClick={handleSubmit}
          disabled={loading || topics.length === 0 || !email.trim()}
          style={{
            width: "100%", padding: "16px", fontSize: 16, fontWeight: 700, borderRadius: 12,
            background: loading ? C.border : "linear-gradient(135deg, " + C.primary + ", " + C.primaryLight + ")",
            color: "#ffffff", border: "none", cursor: loading ? "not-allowed" : "pointer",
            fontFamily: "'Manrope', sans-serif", boxShadow: loading ? "none" : "0 4px 20px " + C.primaryGlow,
            transition: "all 0.3s", letterSpacing: 0.3, opacity: (topics.length === 0 || !email.trim()) ? 0.6 : 1,
          }}
          onMouseEnter={e => { if (!loading) { e.target.style.transform = "translateY(-2px)"; e.target.style.boxShadow = "0 8px 32px " + C.primaryGlow; }}}
          onMouseLeave={e => { e.target.style.transform = "translateY(0)"; e.target.style.boxShadow = loading ? "none" : "0 4px 20px " + C.primaryGlow; }}>
          {loading ? "Starting..." : `Analyze ${topics.length > 1 ? topics.length + " Topics" : "My Topic"} \u2192`}
        </button>
      </div>
    </div>
  );
};

const ProcessingScreen = ({ jobId, onComplete }) => {
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState(null);
  const steps = [
    { label: "Scanning social for trending posts", status: progress > 15 ? "done" : progress > 3 ? "active" : "pending" },
    { label: "Pulling top-performing content", status: progress > 35 ? "done" : progress > 15 ? "active" : "pending" },
    { label: "Mining community discussions", status: progress > 55 ? "done" : progress > 35 ? "active" : "pending" },
    { label: "Spotting patterns & gaps", status: progress > 78 ? "done" : progress > 55 ? "active" : "pending" },
    { label: "Building your content plan", status: progress >= 100 ? "done" : progress > 78 ? "active" : "pending" },
  ];

  // Animate progress bar independently, cap at 95 until API confirms done
  useEffect(() => {
    const t = setInterval(() => setProgress(p => p >= 95 ? 95 : p + 0.6), 200);
    return () => clearInterval(t);
  }, []);

  // Poll API until COMPLETED
  useEffect(() => {
    if (!jobId) return;
    let cancelled = false;
    const poll = async () => {
      try {
        const data = await api.getAngles(jobId);
        if (cancelled) return;
        if (data.status === "COMPLETED" && data.result && data.result.results) {
          setProgress(100);
          setTimeout(() => onComplete(data), 600);
        } else if (data.status === "FAILED") {
          setError("Job failed. Please try again.");
        } else {
          setTimeout(poll, 3000);
        }
      } catch (e) {
        if (!cancelled) setError("Connection error. Retrying...");
        if (!cancelled) setTimeout(poll, 5000);
      }
    };
    setTimeout(poll, 3000);
    return () => { cancelled = true; };
  }, [jobId]);

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "80vh", padding: 20 }}>
      <div style={{ background: C.surface, border: "1px solid " + C.border, borderRadius: 20, padding: "40px 36px", width: "100%", maxWidth: 500, textAlign: "center", position: "relative" }}>
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: "linear-gradient(90deg, " + C.primary + ", " + C.primaryLight + ", transparent)", borderRadius: "20px 20px 0 0" }} />
        <h3 style={{ fontSize: 22, fontWeight: 700, color: C.text, margin: "0 0 6px", fontFamily: "'Manrope', sans-serif" }}>Analyzing your topic...</h3>
        <p style={{ fontSize: 14, color: C.textMuted, marginBottom: 28 }}>Scanning social, search & communities for real-time signals</p>

        <div style={{ display: "flex", flexDirection: "column", gap: 0, textAlign: "left", marginBottom: 32 }}>
          {steps.map((s, i) => (
            <div key={s.label} style={{ display: "flex", alignItems: "flex-start", gap: 14 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0, background: s.status === "done" ? C.greenDim : s.status === "active" ? C.primaryDim : C.surfaceLight, color: s.status === "done" ? C.green : s.status === "active" ? C.primary : C.textMuted, border: "2px solid " + (s.status === "done" ? C.green : s.status === "active" ? C.primary : C.border), transition: "all 0.3s ease", boxShadow: s.status === "active" ? "0 0 12px " + C.primary + "33" : "none" }}>
                  {s.status === "done" ? "\u2713" : s.status === "active" ? (
                    <span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 14 }}>{"\u27F3"}</span>
                  ) : (i + 1)}
                </div>
                {i < steps.length - 1 && <div style={{ width: 2, height: 24, background: s.status === "done" ? C.green : C.border, transition: "background 0.3s" }} />}
              </div>
              <div style={{ paddingTop: 4 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: s.status === "pending" ? C.textMuted : C.text, transition: "color 0.3s" }}>{s.label}</div>
                <div style={{ fontSize: 11, color: s.status === "done" ? C.green : s.status === "active" ? C.primary : C.textMuted }}>
                  {s.status === "done" ? "Complete" : s.status === "active" ? "In progress..." : "Waiting"}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ background: C.surfaceLight, borderRadius: 8, height: 8, overflow: "hidden", marginBottom: 12 }}>
          <div style={{ width: Math.round(progress) + "%", height: "100%", borderRadius: 8, transition: "width 0.4s", background: "linear-gradient(90deg, " + C.primary + ", " + C.primaryLight + ")" }} />
        </div>
        <div style={{ fontSize: 12, color: C.textMuted, fontFamily: "'DM Mono', monospace" }}>{Math.round(progress)}% complete</div>

        {error && (
          <div style={{ marginTop: 16, padding: "8px 14px", background: C.redDim, border: "1px solid " + C.red, borderRadius: 8, fontSize: 12, color: C.red }}>{error}</div>

/* ─── GENERATING POSTS SCREEN ─── */
const GeneratingPostsScreen = ({ jobId, onComplete }) => {
  const [error, setError] = useState(null);
  const [progress, setProgress] = useState(0);
  const steps = [
    { label: "Writing X posts for each angle", status: progress > 25 ? "done" : progress > 3 ? "active" : "pending" },
    { label: "Crafting LinkedIn posts", status: progress > 55 ? "done" : progress > 25 ? "active" : "pending" },
    { label: "Generating article ideas", status: progress > 85 ? "done" : progress > 55 ? "active" : "pending" },
    { label: "Finalising your content plan", status: progress >= 100 ? "done" : progress > 85 ? "active" : "pending" },
  ];

  useEffect(() => {
    const t = setInterval(() => setProgress(p => p >= 92 ? 92 : p + 0.5), 200);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (!jobId) return;
    let cancelled = false;
    const poll = async () => {
      try {
        const data = await api.getAngles(jobId);
        if (cancelled) return;
        const topLevelStatus = data?.result?.post_gen_status || null;
        const topicStatuses = (data?.result?.results || [])
          .map((r) => r?.post_gen_status)
          .filter(Boolean);
        const effectiveStatus =
          topLevelStatus ||
          (topicStatuses.length > 0 ? topicStatuses[0] : null);

        if (effectiveStatus === "COMPLETED") {
          setProgress(100);
          setTimeout(() => onComplete(data), 600);
        } else if (effectiveStatus === "FAILED") {
          const topicError = (data?.result?.results || [])
            .map((r) => r?.post_gen_error)
            .find(Boolean);
          setError(topicError || "Post generation failed. Please try again.");
        } else {
          setTimeout(poll, 3000);
        }
      } catch (e) {
        if (!cancelled) setTimeout(poll, 5000);
      }
    };
    setTimeout(poll, 3000);
    return () => { cancelled = true; };
  }, [jobId]);

  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", minHeight: "80vh", padding: 20 }}>
      <div style={{ background: C.surface, border: "1px solid " + C.border, borderRadius: 20, padding: "40px 36px", width: "100%", maxWidth: 500, textAlign: "center", position: "relative" }}>
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 2, background: "linear-gradient(90deg, " + C.primary + ", " + C.primaryLight + ", transparent)", borderRadius: "20px 20px 0 0" }} />
        <h3 style={{ fontSize: 22, fontWeight: 700, color: C.text, margin: "0 0 6px", fontFamily: "'Manrope', sans-serif" }}>Writing your content...</h3>
        <p style={{ fontSize: 14, color: C.textMuted, marginBottom: 28 }}>Generating X posts, LinkedIn posts, and article ideas for your angles</p>

        <div style={{ display: "flex", flexDirection: "column", gap: 0, textAlign: "left", marginBottom: 32 }}>
          {steps.map((s, i) => (
            <div key={s.label} style={{ display: "flex", alignItems: "flex-start", gap: 14 }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0, background: s.status === "done" ? C.greenDim : s.status === "active" ? C.primaryDim : C.surfaceLight, color: s.status === "done" ? C.green : s.status === "active" ? C.primary : C.textMuted, border: "2px solid " + (s.status === "done" ? C.green : s.status === "active" ? C.primary : C.border), transition: "all 0.3s ease" }}>
                  {s.status === "done" ? "\u2713" : s.status === "active" ? (
                    <span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 14 }}>{"\u27F3"}</span>
                  ) : (i + 1)}
                </div>
                {i < steps.length - 1 && <div style={{ width: 2, height: 24, background: s.status === "done" ? C.green : C.border, transition: "background 0.3s" }} />}
              </div>
              <div style={{ paddingTop: 4 }}>
                <div style={{ fontSize: 14, fontWeight: 600, color: s.status === "pending" ? C.textMuted : C.text }}>{s.label}</div>
                <div style={{ fontSize: 11, color: s.status === "done" ? C.green : s.status === "active" ? C.primary : C.textMuted }}>
                  {s.status === "done" ? "Complete" : s.status === "active" ? "In progress..." : "Waiting"}
                </div>
              </div>
            </div>
          ))}
        </div>

        <div style={{ background: C.surfaceLight, borderRadius: 8, height: 8, overflow: "hidden", marginBottom: 12 }}>
          <div style={{ width: Math.round(progress) + "%", height: "100%", borderRadius: 8, transition: "width 0.4s", background: "linear-gradient(90deg, " + C.primary + ", " + C.primaryLight + ")" }} />
        </div>
        <div style={{ fontSize: 12, color: C.textMuted, fontFamily: "'DM Mono', monospace" }}>{Math.round(progress)}% complete</div>
        {error && <div style={{ marginTop: 16, padding: "8px 14px", background: C.redDim, border: "1px solid " + C.red, borderRadius: 8, fontSize: 12, color: C.red }}>{error}</div>}
      </div>
    </div>
  );
};

const INITIAL_SCHEDULE = [
  { day: "MON", posts: [{ type: "x", idx: 0 }] },
  { day: "TUE", posts: [{ type: "x", idx: 1 }] },
  { day: "WED", posts: [{ type: "x", idx: 2 }, { type: "li", idx: 0 }] },
  { day: "THU", posts: [{ type: "x", idx: 3 }] },
  { day: "FRI", posts: [{ type: "x", idx: 4 }] },
  { day: "SAT", posts: [] },
  { day: "SUN", posts: [{ type: "x", idx: 5 }, { type: "li", idx: 1 }] },
];

const DAY_LABELS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const ScheduleStrip = ({ schedule, onScheduleChange }) => {
  // selected = { dayIdx, postIdxInDay } — the post being moved
  const [selected, setSelected] = useState(null);

  const handlePostClick = (dayIdx, postIdxInDay, e) => {
    e.stopPropagation();
    if (selected && selected.dayIdx === dayIdx && selected.postIdxInDay === postIdxInDay) {
      setSelected(null); // deselect
    } else {
      setSelected({ dayIdx, postIdxInDay });
    }
  };

  const handleDayClick = (targetDayIdx) => {
    if (!selected) return;
    if (selected.dayIdx === targetDayIdx) { setSelected(null); return; }

    const next = schedule.map(s => ({ ...s, posts: [...s.posts] }));
    const post = next[selected.dayIdx].posts.splice(selected.postIdxInDay, 1)[0];
    next[targetDayIdx].posts.push(post);
    onScheduleChange(next);
    setSelected(null);
  };

  const postLabel = (p) => p.type === "x" ? "𝕏 " + (p.idx + 1) : "in " + (p.idx + 1);

  return (
    <div style={{ marginBottom: 32 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 28, height: 28, borderRadius: 7, background: "linear-gradient(135deg, " + C.primary + ", " + C.primaryLight + ")", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>📅</div>
          <span style={{ fontSize: 14, fontWeight: 700, color: C.text, fontFamily: "'Manrope', sans-serif" }}>Posting Schedule</span>
        </div>
        {selected ? (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 11, color: C.primary, fontWeight: 600, fontFamily: "'DM Mono', monospace" }}>
              Moving {schedule[selected.dayIdx].posts[selected.postIdxInDay]?.type === "x" ? "X" : "LinkedIn"} Post — click a day
            </span>
            <button onClick={() => setSelected(null)} style={{ fontSize: 10, color: C.textMuted, background: "none", border: "1px solid " + C.border, borderRadius: 4, padding: "2px 8px", cursor: "pointer", fontFamily: "'DM Mono', monospace" }}>Cancel</button>
          </div>
        ) : (
          <span style={{ fontSize: 10, color: C.textMuted, fontFamily: "'DM Mono', monospace" }}>Click a post to move it</span>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 8 }}>
        {schedule.map((s, i) => {
          const empty = s.posts.length === 0;
          const isHeavy = s.posts.length > 1;
          const isDropTarget = selected && selected.dayIdx !== i;
          return (
            <div key={i} onClick={() => handleDayClick(i)} style={{
              borderRadius: 12, overflow: "hidden", cursor: selected ? "pointer" : "default",
              border: isDropTarget ? "1.5px dashed " + C.primary : (empty ? "1px dashed " + C.border : isHeavy ? "1.5px solid " + C.primary : "1px solid " + C.border),
              background: isDropTarget ? C.primaryDim : (empty ? "transparent" : C.surface),
              opacity: empty && !isDropTarget ? 0.5 : 1,
              transition: "all 0.2s",
              transform: isDropTarget ? "scale(1.02)" : "scale(1)",
            }}>
              {/* Day header */}
              <div style={{
                padding: "8px 0", textAlign: "center",
                background: empty ? "transparent" : isHeavy ? "linear-gradient(135deg, " + C.primary + ", " + C.primaryLight + ")" : C.surfaceLight,
                borderBottom: empty ? "none" : "1px solid " + (isHeavy ? "rgba(0,146,148,0.2)" : C.border),
              }}>
                <div style={{
                  fontSize: 10, fontWeight: 800, letterSpacing: 1,
                  fontFamily: "'DM Mono', monospace",
                  color: isHeavy ? "#fff" : (empty ? C.textMuted : C.text),
                }}>{s.day}</div>
              </div>
              {/* Post badges */}
              <div style={{ padding: "8px 6px", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, minHeight: 48 }}>
                {s.posts.map((p, pi) => {
                  const isX = p.type === "x";
                  const isSelected = selected && selected.dayIdx === i && selected.postIdxInDay === pi;
                  return (
                    <div key={pi} onClick={(e) => handlePostClick(i, pi, e)} style={{
                      display: "flex", alignItems: "center", gap: 4, padding: "4px 8px",
                      background: isSelected ? (isX ? "rgba(0,0,0,0.12)" : "rgba(10,102,194,0.15)") : (isX ? "rgba(0,0,0,0.04)" : C.linkedinDim),
                      borderRadius: 6, width: "100%", justifyContent: "center",
                      cursor: "pointer", transition: "all 0.15s",
                      border: isSelected ? "1.5px solid " + (isX ? C.twitter : C.linkedin) : "1.5px solid transparent",
                      transform: isSelected ? "scale(1.05)" : "scale(1)",
                    }}>
                      <span style={{ fontSize: isX ? 11 : 9, fontWeight: 800, color: isX ? C.text : C.linkedin }}>{isX ? "𝕏" : "in"}</span>
                      <span style={{ fontSize: 9, fontWeight: 700, color: isX ? C.text : C.linkedin, fontFamily: "'DM Mono', monospace" }}>{p.idx + 1}</span>
                    </div>
                  );
                })}
                {empty && !isDropTarget && (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 48 }}>
                    <span style={{ fontSize: 18, opacity: 0.4 }}>—</span>
                  </div>
                )}
                {empty && isDropTarget && (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 48 }}>
                    <span style={{ fontSize: 10, color: C.primary, fontWeight: 600, fontFamily: "'DM Mono', monospace" }}>Drop here</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const ExportBar = ({ xPosts, liPosts, schedule }) => {
  const handleExport = () => {
    let doc = "CONTENTSPARK — THIS WEEK'S CONTENT CALENDAR\n";
    doc += "Topic: " + PLAN.topic + "\n";
    doc += "=" .repeat(60) + "\n\n";

    doc += "BRIEF\n" + "-".repeat(40) + "\n";
    doc += "Angle: " + PLAN.brief.angle + "\n";
    doc += "Target Audience: " + PLAN.brief.audience + "\n";
    doc += "Tone: " + PLAN.brief.tone + "\n";
    doc += "Goal: " + PLAN.brief.goal + "\n";

    doc += "\n\nPOSTING SCHEDULE\n" + "-".repeat(40) + "\n";
    (schedule || INITIAL_SCHEDULE).forEach(s => {
      const labels = s.posts.map(p => p.type === "x" ? "X Post " + (p.idx+1) : "LinkedIn " + (p.idx+1));
      doc += s.day + ": " + (labels.length ? labels.join(", ") : "Rest") + "\n";
    });

    const xData = xPosts || PLAN.x;
    const liData = liPosts || PLAN.linkedin;

    doc += "\n\nX / TWITTER POSTS (" + xData.length + ")\n" + "-".repeat(40) + "\n";
    xData.forEach((p, i) => {
      doc += "\nX POST " + (i+1) + "\n" + p.text + "\n" + p.hashtags + "\n";
    });

    doc += "\n\nLINKEDIN POSTS (" + liData.length + ")\n" + "-".repeat(40) + "\n";
    liData.forEach((p, i) => {
      doc += "\nLINKEDIN " + (i+1) + ": " + p.title + "\n";
      doc += p.hook + "\n\n" + p.body + "\n\n" + p.cta + "\n";
    });

    doc += "\n\nREPURPOSE MAP\n" + "-".repeat(40) + "\n";
    [...xData, ...liData].forEach((p, i) => {
      if (p.repurpose) {
        const label = i < xData.length ? "X Post " + (i+1) : "LinkedIn " + (i - xData.length + 1);
        doc += "\n" + label + ":\n";
        p.repurpose.forEach(r => {
          doc += "  \u2192 " + r.channel + ": " + r.piece + " (" + r.effort + ")\n";
        });
      }
    });

    const blob = new Blob([doc], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ContentSpark_Calendar_" + PLAN.topic.replace(/\s+/g, "_") + ".txt";
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <button onClick={handleExport} style={{
      padding: "6px 16px", fontSize: 11, fontWeight: 600,
      background: C.surface, color: C.text, border: "1px solid " + C.border,
      borderRadius: 8, cursor: "pointer", fontFamily: "'Manrope', sans-serif",
      display: "flex", alignItems: "center", gap: 6,
      transition: "all 0.15s",
    }}
      onMouseEnter={e => { e.currentTarget.style.borderColor = C.primary; e.currentTarget.style.color = C.primary; }}
      onMouseLeave={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.text; }}>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export Plan
    </button>
  );
};

const ReportScreen = ({ onNavigate, jobData, selectedAngleIds, tone, setTone, frequency, setFrequency }) => {
  const [activeAngle, setActiveAngle] = useState(0);
  const [adjustOpen, setAdjustOpen] = useState(false);

  // Build per-angle post state from API data
  // Flatten all topics' angles and generated_posts into single maps
  const allTopicResults = (jobData && jobData.result && jobData.result.results) || [];
  const angles = allTopicResults.flatMap(r => (r.angles || []).map(a => ({ ...a, _topic: r.topic })));
  const generatedPosts = allTopicResults.reduce((acc, r) => Object.assign(acc, r.generated_posts || {}), {});

  // Only show selected angles (or all if none specified)
  const selectedAngles = selectedAngleIds && selectedAngleIds.length > 0
    ? angles.filter(a => selectedAngleIds.includes(a.id))
    : angles;

  // Per-angle editable post state keyed by angle id
  const [anglePostsMap, setAnglePostsMap] = useState(() => {
    const map = {};
    selectedAngles.forEach(angle => {
      const posts = generatedPosts[angle.id] || {};
      map[angle.id] = {
        x: (posts.x_posts || []).map(mapXPost),
        li: (posts.linkedin_posts || []).map(mapLinkedinPost),
        articles: posts.article_ideas || [],
      };
    });
    return map;
  });

  const currentAngle = selectedAngles[activeAngle];
  const currentPosts = currentAngle ? (anglePostsMap[currentAngle.id] || { x: [], li: [], articles: [] }) : { x: [], li: [], articles: [] };

  const updateXPost = (idx, updated) => {
    setAnglePostsMap(prev => {
      const cur = prev[currentAngle.id];
      const next = [...cur.x]; next[idx] = updated;
      return { ...prev, [currentAngle.id]: { ...cur, x: next } };
    });
  };
  const updateLiPost = (idx, updated) => {
    setAnglePostsMap(prev => {
      const cur = prev[currentAngle.id];
      const next = [...cur.li]; next[idx] = updated;
      return { ...prev, [currentAngle.id]: { ...cur, li: next } };
    });
  };

  const xPosts = currentPosts.x;
  const liPosts = currentPosts.li;
  const articleIdeas = currentPosts.articles;

  const [schedule, setSchedule] = useState(INITIAL_SCHEDULE.map(s => ({ ...s, posts: [...s.posts] })));
  const xDayMap = {};
  const liDayMap = {};
  schedule.forEach(s => {
    s.posts.forEach(p => {
      if (p.type === "x") xDayMap[p.idx] = s.day;
      if (p.type === "li") liDayMap[p.idx] = s.day;
    });

const EmailPreviewScreen = ({ jobData, selectedAngleIds, onNavigate }) => {

  const angles = allTopicResults.flatMap(r => (r.angles || []).map(a => ({ ...a, _topic: r.topic })));
  const selectedAngles = (selectedAngleIds && selectedAngleIds.length > 0)
    ? angles.filter(a => selectedAngleIds.includes(a.id))
    : angles.slice(0, 1);
  const generatedPosts = allTopicResults.reduce((acc, r) => Object.assign(acc, r.generated_posts || {}), {});

  // Pull first x post per angle for the preview
  const previewPosts = selectedAngles.map(angle => {
    const posts = generatedPosts[angle.id] || {};
    const xPosts = (posts.x_posts || []);
    return { angle, post: xPosts[0] || null };

  const today = new Date();
  const weekLabel = today.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });

  const totalXPosts = selectedAngles.reduce((sum, a) => sum + ((generatedPosts[a.id] || {}).x_posts || []).length, 0);
  const totalLinkedIn = selectedAngles.reduce((sum, a) => sum + ((generatedPosts[a.id] || {}).linkedin_posts || []).length, 0);

                    <div style={{ width: 32, height: 32, borderRadius: "50%", background: "linear-gradient(135deg, #009294, #00b0b3)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <span style={{ fontSize: 14, color: "#fff", fontWeight: 800 }}>V</span>
                    </div>
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: C.text }}>VisibilityStack</div>
                      <div style={{ fontSize: 11, color: C.textMuted }}>@visibilitystack</div>
                    </div>
                  </div>
                  <p style={{ fontSize: 14, color: C.text, lineHeight: 1.65, margin: 0 }}>{previewPosts[0].post.content}</p>
                </div>
              </div>
            )}

            {/* CTA */}
            <div style={{ textAlign: "center", marginBottom: 28 }}>
              <div style={{ fontSize: 14, color: C.textSecondary, lineHeight: 1.6, marginBottom: 16 }}>
                Your full calendar has {totalXPosts} X {totalXPosts === 1 ? "post" : "posts"}, {totalLinkedIn} LinkedIn {totalLinkedIn === 1 ? "post" : "posts"}, and {totalArticles} article {totalArticles === 1 ? "idea" : "ideas"} — all editable in one click.
              </div>
              <a href="#" style={{
                display: "inline-block", padding: "14px 36px", fontSize: 15, fontWeight: 700,
                background: "linear-gradient(135deg, #009294, #00b0b3)", color: "#fff",
                borderRadius: 10, textDecoration: "none", fontFamily: "'Manrope', sans-serif",
                boxShadow: "0 4px 18px rgba(0,146,148,0.3)",
              }}>
                View My Full Content Calendar →
              </a>
            </div>

            {/* Divider */}
            <div style={{ borderTop: "1px solid " + C.border, margin: "4px 0 20px" }} />

            {/* Tip of the week */}
            <div style={{ background: C.surfaceLight, borderRadius: 10, padding: "16px 18px", marginBottom: 24 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: C.primary, fontFamily: "'DM Mono', monospace", letterSpacing: 0.5, marginBottom: 6 }}>💡 TIP OF THE WEEK</div>
              <p style={{ fontSize: 13, color: C.textSecondary, lineHeight: 1.65, margin: 0 }}>
                Post your strongest X post on Tuesday or Wednesday morning. Those days consistently see the highest engagement windows for B2B audiences. Schedule it the night before using your favourite tool.
              </p>
            </div>

            {/* Footer */}
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.7 }}>
                You're receiving this because you signed up for weekly content calendars from VisibilityStack.<br />
                <a href="#" style={{ color: C.primary, textDecoration: "none" }}>Unsubscribe</a> &nbsp;·&nbsp;
                <a href="#" style={{ color: C.primary, textDecoration: "none" }}>Update preferences</a> &nbsp;·&nbsp;
                <a href="#" style={{ color: C.primary, textDecoration: "none" }}>View in browser</a>
              </div>
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 10 }}>
                © {new Date().getFullYear()} VisibilityStack · London, UK
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
};

/* ─── PROTOTYPE CONTROLS (fixed bottom-right) ─── */
const ScreenToggle = ({ screen, setScreen }) => {
  const [collapsed, setCollapsed] = useState(false);
  const screens = [
    { label: "Landing Page", idx: 0 },
    { label: "Processing", idx: 1 },
    { label: "Pick Angle", idx: 2 },
    { label: "Content Calendar", idx: 4 },
    { label: "Email Preview", idx: 6 },
    { label: "PRD", idx: 5 },
  ];

  return (
    <div style={{
      position: "fixed", bottom: 24, right: 24, zIndex: 999,
      background: "#fff", border: "1px solid " + C.border, borderRadius: 12,
      boxShadow: "0 4px 24px rgba(0,0,0,0.1), 0 1px 4px rgba(0,0,0,0.06)",
      width: collapsed ? "auto" : 380, overflow: "hidden", transition: "width 0.2s",
    }}>
      {/* Header */}
      <button onClick={() => setCollapsed(!collapsed)} style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%",
        padding: "10px 14px", background: "transparent", border: "none", borderBottom: collapsed ? "none" : "1px solid " + C.border,
        cursor: "pointer",
      }}>
        <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", color: C.textMuted, fontFamily: "'DM Mono', monospace" }}>PROTOTYPE CONTROLS</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.textMuted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
          style={{ transform: collapsed ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s" }}>
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      {/* Pills */}
      {!collapsed && (
        <div style={{ padding: "10px 14px 12px" }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: C.text, marginBottom: 8 }}>View</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {screens.map((s) => {
              const active = screen === s.idx;
              return (
                <button key={s.label} onClick={() => setScreen(s.idx)} style={{
                  padding: "6px 14px", fontSize: 11, fontWeight: 600, cursor: "pointer",
                  background: "transparent",
                  color: active ? C.primary : C.textMuted,
                  border: active ? "1.5px solid " + C.primary : "1.5px solid " + C.border,
                  borderRadius: 999, transition: "all 0.15s", fontFamily: "'Manrope', sans-serif",
                  whiteSpace: "nowrap",
                }}
                  onMouseEnter={e => { if (!active) { e.currentTarget.style.borderColor = C.textMuted; e.currentTarget.style.color = C.text; }}}
                  onMouseLeave={e => { if (!active) { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.textMuted; }}}>
                  {s.label}
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

/* ─── MAIN APP ─── */
function ContentSpark() {
  const [screen, setScreen] = useState(0);
  const [topics, setTopics] = useState([]);
  const [email, setEmail] = useState("");
  const [frequency, setFrequency] = useState(1);
  const [jobId, setJobId] = useState(null);
  const [jobData, setJobData] = useState(null);      // from phase 1 polling
  const [selectedAngleIds, setSelectedAngleIds] = useState([]);
  const [tone, setTone] = useState("Conversational");
  const [submitError, setSubmitError] = useState(null);
  const [submitLoading, setSubmitLoading] = useState(false);

  // Phase 1: create job → go to processing
  const handleSubmit = async (topicsList, e, freq = 1) => {
    setSubmitError(null);
    setSubmitLoading(true);
    try {
      const id = await api.createJob(topicsList, e, freq);
      setJobId(id);
      setScreen(1);
    } catch (err) {
      setSubmitError(err.message || "Could not connect to the server. Make sure the API is running.");
    } finally {
      setSubmitLoading(false);
    }
  };

  // Phase 1 complete: angles ready
  const handleAnglesReady = (data) => {
    setJobData(data);
    setScreen(2);
  };

  // Phase 2: submit selected angles
  const handleProcessAngles = async (angleIds, selectedTone) => {
    setSelectedAngleIds(angleIds);
    try {
      await api.processAngles(jobId, angleIds, selectedTone);
      setScreen(3);
    } catch (err) {
      alert("Failed to start post generation. Please try again.");
    }
  };

  // Phase 2 complete: posts ready
  const handlePostsReady = (data) => {
    setJobData(data);
    setScreen(4);
  };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Manrope', system-ui, sans-serif" }}>

      {/* NAV */}
      <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 40px", height: 72, background: "#FFFFFF", borderBottom: "1px solid #f0f0f0", position: "sticky", top: 0, zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexShrink: 0 }} onClick={() => setScreen(0)}>
          <VSLogoMark size={36} />
          <div style={{ display: "flex", flexDirection: "column", lineHeight: 1.15 }}>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", color: C.text }}>VISIBILITY</span>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", color: C.text }}>STACK</span>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 28 }}>
          <NavLink label="Platform" hasDropdown />
          <NavLink label="Embedded Team" />
          <NavLink label="Results" hasDropdown />
          <NavLink label="Academy" hasDropdown />
          <NavLink label="Tools" />
          <NavLink label="Pricing" />
          <NavLink label="About" />
        </div>

        <button style={{ padding: "10px 24px", fontSize: 14, fontWeight: 600, borderRadius: 9999, background: C.primary, color: "#FFFFFF", border: "none", cursor: "pointer", transition: "background 0.15s", flexShrink: 0 }}
          onMouseEnter={e => e.target.style.background = C.primaryHover}
          onMouseLeave={e => e.target.style.background = C.primary}>
          Book a Demo
        </button>
      </nav>

      {/* SCREENS */}
      <div>
        {screen === 0 && (
          <LandingScreen
            topics={topics} setTopics={setTopics}
            email={email} setEmail={setEmail}
            frequency={frequency} setFrequency={setFrequency}
            onSubmit={handleSubmit}
            loading={submitLoading}
            error={submitError}
          />
        )}
        {screen === 1 && (
          <ProcessingScreen jobId={jobId} onComplete={handleAnglesReady} />
        )}
        {screen === 2 && (
          <SignalPickerScreen
            angles={(jobData && jobData.result && jobData.result.results || []).flatMap(r =>
              (r.angles || []).map(a => ({ ...a, _topic: r.topic }))
            )}
            tone={tone} setTone={setTone}
            onSubmit={handleProcessAngles}
            onNavigate={setScreen}
          />
        )}
        {screen === 3 && (
          <GeneratingPostsScreen jobId={jobId} onComplete={handlePostsReady} />
        )}
        {screen === 4 && (
          <ReportScreen
            jobData={jobData}
            selectedAngleIds={selectedAngleIds}
            onNavigate={setScreen}
            tone={tone} setTone={setTone}
            frequency={frequency} setFrequency={setFrequency}
          />
        )}
        {screen === 5 && <PRDScreen />}
      </div>

      {/* Screen Toggle */}
      <ScreenToggle screen={screen} setScreen={setScreen} />
    </div>
  );
}
