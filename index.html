<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --border: #e4e4e7;
      --accent: #6d28d9;
      --accent-light: #7c3aed;
      --accent-glow: rgba(109, 40, 217, 0.08);
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #a1a1aa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 24px;
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-light);
      background: var(--accent-glow);
      border: 1px solid rgba(109, 40, 217, 0.4);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #18181b 0%, #6d28d9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .table-wrap {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      border-bottom: 1px solid var(--border);
    }

    th {
      text-align: left;
      padding: 14px 24px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #fafafb;
    }

    td {
      padding: 18px 24px;
      font-size: 0.92rem;
      vertical-align: middle;
    }

    .tool-num {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      width: 40px;
    }

    .tool-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .tool-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-glow);
      border: 1px solid rgba(109, 40, 217, 0.3);
      margin-right: 12px;
      font-size: 1rem;
      vertical-align: middle;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent-light);
      background: var(--accent-glow);
      border: 1px solid rgba(109, 40, 217, 0.35);
      border-radius: 8px;
      padding: 6px 14px;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .open-btn:hover {
      background: rgba(109, 40, 217, 0.4);
      border-color: rgba(109, 40, 217, 0.7);
      color: #c4b5fd;
    }

    .open-btn svg {
      width: 13px;
      height: 13px;
      transition: transform 0.15s ease;
    }

    .open-btn:hover svg {
      transform: translateX(2px);
    }

    footer {
      margin-top: 40px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">Lead Magnets</div>
    <h1>Tools</h1>
    <p class="subtitle">A collection of free tools to grow your business</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="tool-num">#</th>
          <th>Tool</th>
          <th>Launch</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="tool-num">1</td>
          <td>
            <span class="tool-icon">✦</span>
            <span class="tool-name">ContentSpark</span>
          </td>
          <td>
            <a href="/contentspark" class="open-btn">
              Open
              <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>© 2026 · All tools are free to use · Created by Mohit Sharma</footer>

</body>
</html>
